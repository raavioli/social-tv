apiVersion: v1
kind: Secret
metadata:
  name: socialtv-api-keys
  namespace: socialtv
type: Opaque
stringData:
  OPENAI_API_KEY: ""
  ELEVENLABS_API_KEY: ""
  NEWS_API_KEY: ""
  REDDIT_CLIENT_ID: ""
  REDDIT_CLIENT_SECRET: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: socialtv-api-config
  namespace: socialtv
data:
  NODE_ENV: "production"
  PORT: "3001"
  REDIS_URL: "redis://socialtv-redis:6379"
  DATABASE_URL: "postgresql://socialtv:socialtv_dev@socialtv-postgres:5432/socialtv"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialtv-api
  namespace: socialtv
  labels: { app: socialtv-api }
spec:
  replicas: 1
  selector: { matchLabels: { app: socialtv-api } }
  template:
    metadata: { labels: { app: socialtv-api } }
    spec:
      containers:
        - name: api
          image: localhost/socialtv-api:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: { name: socialtv-api-config }
            - secretRef:    { name: socialtv-api-keys }
          ports: [{ containerPort: 3001, name: http }]
          resources:
            requests: { cpu: "50m",  memory: "128Mi" }
            limits:   { cpu: "1",    memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: socialtv-api
  namespace: socialtv
spec:
  type: ClusterIP
  selector: { app: socialtv-api }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: socialtv-api
  namespace: socialtv
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: socialtv.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: socialtv-api
                port: { number: 3001 }
