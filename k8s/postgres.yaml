apiVersion: v1
kind: Secret
metadata:
  name: socialtv-postgres
  namespace: socialtv
type: Opaque
stringData:
  POSTGRES_USER: socialtv
  POSTGRES_PASSWORD: socialtv_dev
  POSTGRES_DB: socialtv
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: socialtv-postgres-data
  namespace: socialtv
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: { storage: 5Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialtv-postgres
  namespace: socialtv
  labels: { app: socialtv-postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: socialtv-postgres } }
  template:
    metadata: { labels: { app: socialtv-postgres } }
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          envFrom:
            - secretRef: { name: socialtv-postgres }
          ports: [{ containerPort: 5432, name: pg }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data, subPath: pgdata }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "1",   memory: "1Gi" }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "socialtv"] }
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: socialtv-postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: socialtv-postgres
  namespace: socialtv
spec:
  type: ClusterIP
  selector: { app: socialtv-postgres }
  ports:
    - { name: pg, port: 5432, targetPort: 5432 }
