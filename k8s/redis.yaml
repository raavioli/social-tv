apiVersion: apps/v1
kind: Deployment
metadata:
  name: socialtv-redis
  namespace: socialtv
  labels: { app: socialtv-redis }
spec:
  replicas: 1
  selector: { matchLabels: { app: socialtv-redis } }
  template:
    metadata: { labels: { app: socialtv-redis } }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["--save", "", "--appendonly", "no"]
          ports: [{ containerPort: 6379, name: redis }]
          resources:
            requests: { cpu: "20m", memory: "32Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
          readinessProbe:
            tcpSocket: { port: 6379 }
            initialDelaySeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: socialtv-redis
  namespace: socialtv
spec:
  type: ClusterIP
  selector: { app: socialtv-redis }
  ports:
    - { name: redis, port: 6379, targetPort: 6379 }
